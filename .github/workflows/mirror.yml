name: mirror

# Copies one release to the static download path for users in China:
#   https://www.7d24h.work/downloads/templates/<tag>/   zips, previews, signed catalog
#   https://www.7d24h.work/downloads/templates/catalog.v1.json(.sig)
#                                                      newest catalog, read by the desktop app
# Files only: the site has no template pages and no directory listing. Each
# template is its own zip, so a single template can also be downloaded
# directly by its mirrorZip URL.
#
# release.yml calls this after every release; run it by hand to upload a
# release again. The server side accepts one key that can only write below
# ~/downloads/templates (README.md, "Release setup"). Without the three MIRROR_*
# secrets the job only warns: the desktop app then uses GitHub.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (templates-YYYY.MM.DD[.N])
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      MIRROR_URL: https://www.7d24h.work/downloads/templates
    steps:
      - name: Mirror credentials
        id: creds
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_SSH_HOST: ${{ secrets.MIRROR_SSH_HOST }}
          MIRROR_SSH_KNOWN_HOSTS: ${{ secrets.MIRROR_SSH_KNOWN_HOSTS }}
        run: |
          echo "$TAG" | grep -Eq '^templates-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' || { echo "::error::bad tag: $TAG"; exit 1; }
          if [ -z "$MIRROR_SSH_KEY" ] || [ -z "$MIRROR_SSH_HOST" ] || [ -z "$MIRROR_SSH_KNOWN_HOSTS" ]; then
            echo "::warning::MIRROR_SSH_KEY / MIRROR_SSH_HOST / MIRROR_SSH_KNOWN_HOSTS not set; $TAG is on GitHub only"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror && chmod 600 ~/.ssh/mirror
          printf '%s\n' "$MIRROR_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Download and check the release
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --dir "$RUNNER_TEMP/release"
          node tools/verify-release.mjs --dir "$RUNNER_TEMP/release" --tag "$TAG"

      - name: Upload
        if: steps.creds.outputs.ready == 'true'
        env:
          MIRROR_SSH_HOST: ${{ secrets.MIRROR_SSH_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ssh_cmd="ssh -i $HOME/.ssh/mirror -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30"
          # Paths are relative to ~/downloads/templates (the key's only directory).
          rsync -rtp --chmod=D755,F644 -e "$ssh_cmd" "$RUNNER_TEMP/release/" "$MIRROR_SSH_HOST:$TAG/"
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$latest" = "$TAG" ]; then
            # Both files are put in place together at the end of the transfer.
            rsync -tp --chmod=F644 --delay-updates -e "$ssh_cmd" \
              "$RUNNER_TEMP/release/catalog.v1.json" "$RUNNER_TEMP/release/catalog.v1.json.sig" "$MIRROR_SSH_HOST:./"
          else
            echo "$TAG is not the newest release ($latest); the top-level catalog is left as it is"
          fi

      - name: The mirror serves the same bytes
        if: steps.creds.outputs.ready == 'true'
        run: |
          cd "$RUNNER_TEMP/release"
          for file in *; do
            remote=$(curl -fsSL --retry 3 "$MIRROR_URL/$TAG/$file" | sha256sum | cut -d' ' -f1)
            [ "$remote" = "$(sha256sum "$file" | cut -d' ' -f1)" ] || { echo "::error::$MIRROR_URL/$TAG/$file differs"; exit 1; }
          done
          echo "$MIRROR_URL/$TAG/: $(ls | wc -l) file(s) match the release"
