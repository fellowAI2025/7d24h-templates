name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly: official files still match their official addresses
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same compiler and bundle as the desktop app. The app pins no Linux build,
  # so CI pins the official musl release by its SHA-256.
  TECTONIC_URL: https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
  TECTONIC_SHA256: 8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7
  # biber 2.17 matches biblatex in bundle v33; same pin as the desktop app.
  BIBER_URL: https://sourceforge.net/projects/biblatex-biber/files/biblatex-biber/2.17/binaries/Linux/biber-linux_x86_64.tar.gz/download
  BIBER_SHA256: 129d2e0332a57e985ffa253e5e9fbd28ef99af5a068d1b141145211969aa8999

jobs:
  templates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Schemas are generated from tools/lib/schema.mjs
        run: node tools/schemas.mjs --check
      - name: Validate (schema, files, hashes, official files, markers, content)
        run: node tools/validate.mjs
      - name: Released versions are unchanged
        run: node tools/catalog.mjs --check

      - name: No system TeX on this machine
        run: |
          for tool in tex latex pdflatex xelatex lualatex kpsewhich; do
            if command -v "$tool" >/dev/null; then echo "::error::system TeX found: $(command -v "$tool")"; exit 1; fi
          done
      - name: Install Tectonic 0.17.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tectonic.tar.gz" "$TECTONIC_URL"
          echo "$TECTONIC_SHA256  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install biber 2.17 (only when a template uses biblatex)
        run: |
          if grep -qs '"biber": "2.17"' typage/*/typage.json; then
            curl -fsSL -o "$RUNNER_TEMP/biber.tar.gz" "$BIBER_URL"
            echo "$BIBER_SHA256  $RUNNER_TEMP/biber.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/biber.tar.gz" -C "$RUNNER_TEMP/bin"
          fi
      - name: Tectonic bundle cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tectonic-cache
          key: tectonic-0.17.0-v33-${{ hashFiles('typage/**') }}
          restore-keys: tectonic-0.17.0-v33-
      - name: Compile every template and variant (Tectonic only, then offline)
        run: node tools/compile.mjs --tectonic tectonic --cache "$RUNNER_TEMP/tectonic-cache"

  official-files:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Official files match their official addresses
        run: node tools/check-official.mjs
